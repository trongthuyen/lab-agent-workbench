name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run eval
      - name: Sample project quality gates
        run: |
          npm ci --prefix evals/fixtures/nestjs-sample
          npm run lint --prefix evals/fixtures/nestjs-sample
          npm run typecheck --prefix evals/fixtures/nestjs-sample
          npm test --prefix evals/fixtures/nestjs-sample
      - name: Audit
        if: runner.os == 'Linux'
        run: npm audit --audit-level=high
